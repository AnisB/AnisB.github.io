<text x="62" y="310" font-size="14" fill="#1c1b19">The simulation is fixed in UV and scrolls there at a constant rate. Squeeze a stretch of mesh into less</text>
<text x="62" y="332" font-size="14" fill="#1c1b19">UV and each quad covers fewer periods of it, so back on the ground the pattern is stretched out and</text>
<text x="62" y="354" font-size="14" fill="#1c1b19">sweeps past faster. Give that stretch more UV instead and the water slows down.</text>
<text x="62" y="384" font-size="13" fill="#6b6862">Acceleration is decided by the unwrap, not by the simulation.</text>
</svg>
