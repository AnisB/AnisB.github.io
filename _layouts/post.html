---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    · Anis Benyoub
    {%- if page.original_url %} · <a href="{{ page.original_url }}">Original post</a>{% endif %}
  </p>
  {{ content }}
</article>
<nav class="post-nav">
  {%- if page.next %}<p>Newer: <a href="{{ page.next.url | relative_url }}">{{ page.next.title }}</a></p>{% endif %}
  {%- if page.previous %}<p>Older: <a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }}</a></p>{% endif %}
</nav>
